<!-- Custom Right Click Menu -->
<div id="customMenu" class="position-absolute bg-dark border border-secondary rounded shadow p-2" style="display:none;z-index:9999;width:160px;">

<button class="dropdown-item text-white d-flex align-items-center gap-2" onclick="copyText()">
<i class="bi bi-copy"></i> Copy
</button>

<script>

let devUnlocked=false;


/* ==============================
   ALT + X → Toggle Dev Mode
============================== */
document.addEventListener("keydown",function(e){

if(e.altKey && e.code==="KeyX"){

devUnlocked=!devUnlocked;

if(devUnlocked){
// showNotification("Developer mode unlocked");
}else{
// showNotification("Developer mode locked");
}

}

});


/* ==============================
   Block DevTools Shortcuts
============================== */

document.addEventListener("keydown",function(e){

if(!devUnlocked){

if(e.ctrlKey && e.key.toLowerCase()==='u'){
e.preventDefault();
}

if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='i'){
e.preventDefault();
}

if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()==='c'){
e.preventDefault();
}

if(e.keyCode===123){
e.preventDefault();
}

}

});


/* ==============================
   Detect DevTools Open
============================== */

let devtoolsOpen=false;

setInterval(function(){

const threshold=160;

const opened=
window.outerWidth-window.innerWidth>threshold ||
window.outerHeight-window.innerHeight>threshold;

if(devtoolsOpen && !opened){

devUnlocked=false;
showNotification("Developer mode locked");

}

devtoolsOpen=opened;

},500);



/* ==============================
   Custom Right Click Menu
============================== */

const menu=document.getElementById("customMenu");

let lastFocusedInput=null;


/* track last focused input */

document.addEventListener("focusin",function(e){

if(e.target.tagName==="INPUT" || e.target.tagName==="TEXTAREA"){
lastFocusedInput=e.target;
}

});


/* disable browser right click everywhere */

document.addEventListener("contextmenu",function(e){

if(!devUnlocked){

e.preventDefault();

menu.style.top=e.pageY+"px";
menu.style.left=e.pageX+"px";
menu.style.display="block";

}

});


document.addEventListener("click",function(){

menu.style.display="none";

});


/* ==============================
   Notification
============================== */

function showNotification(msg){

const box=document.getElementById("notificationBox");

box.textContent=msg;
box.style.opacity="1";

setTimeout(function(){
box.style.opacity="0";
},1500);

}



/* ==============================
   COPY
============================== */

function copyText(){

const selection=window.getSelection().toString();

if(!selection)return;

navigator.clipboard.writeText(selection)
.then(()=>showNotification("Copied"))
.catch(()=>showNotification("Copy failed"));

}



/* ==============================
   PASTE
============================== */

function pasteText(){

const active=lastFocusedInput;

if(!active){
showNotification("Focus on an input to paste");
return;
}

navigator.clipboard.readText()
.then(function(text){

const start=active.selectionStart;
const end=active.selectionEnd;

active.value=
active.value.substring(0,start)+
text+
active.value.substring(end);

const pos=start+text.length;

active.setSelectionRange(pos,pos);
active.focus();

showNotification("Pasted");

})
.catch(()=>showNotification("Failed to read clipboard"));

}

</script>
